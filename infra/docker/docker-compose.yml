services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Zentrix_Dev_2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - zentrix_sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "Zentrix_Dev_2026!"
    entrypoint: /bin/bash
    command: >
      -c "/opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"IF DB_ID('zentrix') IS NULL CREATE DATABASE zentrix\""

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_NAME: zentrix
      DB_USER: sa
      DB_PASSWORD: "Zentrix_Dev_2026!"
      ZENTRIX_JWT_SECRET: "dev-only-secret-do-not-use-in-staging-or-prod-0123456789"
      ZENTRIX_ENCRYPTION_KEY: "5wYYAh1IGo8WzWpCyjxwWM5/LmMsR7FFF328IRYYwJI="
      ZENTRIX_BOOTSTRAP_ADMIN_EMAIL: "admin@zentrix.local"
      ZENTRIX_BOOTSTRAP_ADMIN_PASSWORD: "Zentrix_Admin_2026!"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8080"
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  zentrix_sqlserver_data:
