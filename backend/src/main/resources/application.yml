spring:
  application:
    name: zentrix-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        # Preserva mayúsculas/minúsculas exactas de @Table/@Column (EMPRESA, EmpresaId, ...)
        # en vez del snake_case en minúsculas que aplica Spring por defecto.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

zentrix:
  cors:
    allowed-origins: ${ZENTRIX_CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${ZENTRIX_JWT_SECRET}
    expiration-minutes: ${ZENTRIX_JWT_EXPIRATION_MINUTES:30}
  security:
    # Clave AES-256 (Base64, 32 bytes) para cifrar ConfiguracionJson de políticas WIFI/VPN.
    encryption-key: ${ZENTRIX_ENCRYPTION_KEY}
  storage:
    apk-dir: ${ZENTRIX_APK_DIR:./data/apks}
  bootstrap:
    # Si ambos valores están presentes al iniciar, se crea (una sola vez) el primer
    # usuario SUPER_ADMIN. Dejar vacío en staging/prod salvo durante el arranque inicial.
    admin-email: ${ZENTRIX_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${ZENTRIX_BOOTSTRAP_ADMIN_PASSWORD:}
