name: CI/CD

# Implementa el pipeline descrito en docs/06_Despliegue_y_DevOps.md, sección 3:
# 1) Build  2) Test  3) Análisis estático  4) Build de imágenes (tag = hash de commit)
# 5) Deploy a Staging (merge a main)  6) Deploy a Producción (manual/aprobado).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancela ejecuciones previas de la misma rama/PR para no acumular cola.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 1+2) Backend: compilar y ejecutar las pruebas unitarias (JUnit 5 + Mockito).
  backend:
    name: Backend · build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build + test
        run: ./mvnw -B -ntp verify
      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  # 1+2+3) Frontend: lint (análisis estático) + build de producción.
  frontend:
    name: Frontend · lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build

  # 4) Build (y publicación en GHCR) de las imágenes Docker versionadas por hash de commit.
  #    Solo en push a main; los PR no publican imágenes.
  images:
    name: Docker images · build + push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
      - name: Build + push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8080
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

  # 5) Deploy automático a Staging en cada merge a main, usando el MISMO artefacto ya construido.
  #    El paso de deploy real depende del proveedor de infraestructura del ambiente Staging:
  #    se configura como secreto/variable del "environment" de GitHub y se completa el comando abajo.
  deploy-staging:
    name: Deploy · Staging
    runs-on: ubuntu-latest
    needs: [images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Desplegar imagen versionada a Staging
        run: |
          echo "Artefacto a desplegar: ghcr.io/${{ github.repository }}/{backend,frontend}:${{ github.sha }}"
          echo "TODO: invocar el deploy real de Staging con las credenciales del environment 'staging'."
          echo "Las migraciones Flyway corren automáticamente al arrancar el backend en staging (docs/06 §5)."

  # 6) Deploy a Producción: manual/aprobado (protección del environment 'production'),
  #    reutilizando el mismo artefacto validado en Staging — no se reconstruye (docs/06 §3).
  deploy-production:
    name: Deploy · Producción
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: Ejecutar migraciones (paso controlado) y desplegar
        run: |
          echo "Artefacto a promover: ghcr.io/${{ github.repository }}/{backend,frontend}:${{ github.sha }}"
          echo "TODO: paso 1 — ejecutar migraciones Flyway como paso explícito y revisado (docs/06 §5)."
          echo "TODO: paso 2 — invocar el deploy real de Producción con las credenciales del environment 'production'."
